      if (signature.join() !== '137,80,78,71,13,10,26,10') throw new Error('PNG signature verification failed')
      liveURL = URL.createObjectURL(blob)
      const image = new Image()
      image.src = liveURL
      await image.decode()
      if (image.naturalWidth !== 160 || image.naturalHeight !== 80) throw new Error('Decoded PNG dimensions ' + image.naturalWidth + 'x' + image.naturalHeight + ' differ from160x80; PNG header=' + record.blob.headerWidth + 'x' + record.blob.headerHeight)
      const canvas = document.createElement('canvas')
      canvas.width = 160; canvas.height = 80
      const context = canvas.getContext('2d')
      context.drawImage(image, 0, 0)
      const pixels = context.getImageData(0, 0, 160, 80).data
      let red = 0, blue = 0
      for (let y = 0; y < 80; y++) for (let x = 0; x < 160; x++) {
        const i = (y * 160 + x) * 4
        const expected = x < 80 ? [255, 0, 0, 255] : [0, 0, 255, 255]
        if (expected.some((value, channel) => value !== pixels[i + channel])) throw new Error('Decoded red/blue pixel verification failed at' + x + ',' + y)
        if (x < 80) red++; else blue++
      }
      record.png = { mime: blob.type, bytes: blob.size, signature, width: image.naturalWidth, height: image.naturalHeight, redPixels: red, bluePixels: blue, allPixelsVerified: true, decodedBeforePreview: true }
      record.activeURL = liveURL
      preview.href = liveURL
      preview.hidden = false
      cleanup.disabled = false
      display(record.prechecks.allPassed ? 'ready' : 'ready-with-failures', record.prechecks.allPassed ? '图片已准备好，请点击预览。' : '图片已准备好；前置验证有失败，请展开记录。')
      emit('png-verified')
    } catch (error) {
      disposeOwned()
      if (liveURL) URL.revokeObjectURL(liveURL)
      liveURL = null; record.activeURL = null
      display('error', '图片生成失败，请展开验证记录。')
      generate.hidden = false
      emit('prepare-error', { error: String(error) })
    }
  }
  preview.addEventListener('click', event => {
    display('preview-clicked', '看见红蓝图片后，请返回此页清理预览。')
    emit('preview-click', { isTrusted: event.isTrusted, eventTimeStamp: event.timeStamp, activation: activation(), href: preview.href, target: preview.target, rel: preview.rel })
  })
  cleanup.addEventListener('click', event => {
    disposeOwned()
    record.resourceCleanup = cleanupState()
    const revokedURL = liveURL
    if (liveURL) URL.revokeObjectURL(liveURL)
    liveURL = null; record.activeURL = null
    preview.removeAttribute('href'); preview.hidden = true
    cleanup.disabled = true; generate.hidden = false
    display('cleaned', '预览已清理。')
    emit('preview-cleaned', { isTrusted: event.isTrusted, activation: activation(), revokedURL })
  })
  generate.addEventListener('click', prepare)
  document.addEventListener('visibilitychange', () => emit('visibility', { value: document.visibilityState }))
  window.addEventListener('focus', () => emit('focus'))
  window.addEventListener('pagehide', () => { disposeOwned(); if (liveURL) URL.revokeObjectURL(liveURL); liveURL = null })
  emit('page-ready')
  prepare()
})()

</script></body></html>
