name: 🚀　Release

# A master merge must not publish npm before the V2 release gates are reviewed.
on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Version expected from semantic-release, for example 2.0.0
        required: true
        type: string

concurrency:
  group: npm-release-master
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  verify:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️　Checkout exact verified revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: master

      - name: 🧾　Verify master has not moved
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$GITHUB_SHA"

      - name: 🎉　Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 🎉　Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 🚧　Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 📦　Build the package to publish
        run: pnpm run build

      - name: 🔎　Verify the actual npm tarball
        run: pnpm run test:package

      - name: 🔑　Generate bot token
        uses: wow-actions/use-app-token@v2
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.PRIVATE_KEY }}

      - name: 🧮　Plan release without publishing
        id: plan
        uses: cycjimmy/semantic-release-action@v4
        with:
          dry_run: true
          semantic_version: 24.2.9
          extends: '@bubkoo/semantic-release-config@1.6.1'
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ env.BOT_TOKEN }}

      - name: 🧾　Verify planned version and npm predecessor
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          PLANNED_VERSION: ${{ steps.plan.outputs.new_release_version }}
          PREVIOUS_VERSION: ${{ steps.plan.outputs.last_release_version }}
        run: |
          test -n "$PLANNED_VERSION"
          test "$PLANNED_VERSION" = "$EXPECTED_VERSION"
          test "$(npm view html-to-image version --registry=https://registry.npmjs.org)" = "$PREVIOUS_VERSION"
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "$GITHUB_SHA"

      - name: 📦　Publish npm and GitHub release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24.2.9
          extends: '@bubkoo/semantic-release-config@1.6.1'
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ env.BOT_TOKEN }}
          GIT_AUTHOR_NAME: ${{ env.BOT_NAME }}[bot]
          GIT_AUTHOR_EMAIL: ${{ env.BOT_NAME }}[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ env.BOT_NAME }}[bot]
          GIT_COMMITTER_EMAIL: ${{ env.BOT_NAME }}[bot]@users.noreply.github.com

      - name: 🎉　Setup GitHub Package Registry
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: bubkoo

      - name: 🔀　Publish to GitHub Package Registry
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          sed -i 's/\("name"\:[[:space:]]*"\)\(html-to-image"\)/\1@bubkoo\/\2/' package.json
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
