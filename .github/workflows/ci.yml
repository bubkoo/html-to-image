name: 👷　CI
on:
  pull_request:
  push:
    branches:
      - master
      - next
      - next-major
      - alpha
      - beta
jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: ⤵️　Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🧾　Verify tested revision
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$GITHUB_SHA"
          echo "Tested checkout: $actual_sha"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            actual_head="$(git rev-parse HEAD^2)"
            test "$actual_head" = "${{ github.event.pull_request.head.sha }}"
            echo "PR head in tested merge: $actual_head"
          fi

      - name: 🎉　Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false

      - name: 🎉　Setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 🚧　Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 🧹　Check source and test lint
        run: pnpm run lint:check

      - name: 📦　Build
        run: pnpm run build

      - name: 🔎　Check published entries
        run: pnpm run test:package

      - name: 🔎　Check browser test types
        run: pnpm run test:browser:types

      - name: ✅　Test
        run: pnpm run test

      - name: 🌐　Install browser engines
        run: pnpm exec playwright install --with-deps

      - name: 🧪　Test browser behavior
        run: pnpm run test:browser:source

      - name: 📦　Test built package in browsers
        run: pnpm run test:browser:package

      - name: 📋　Upload browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: 🔑　Generate Token
        if: github.event_name == 'push'
        uses: wow-actions/use-app-token@v2
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.PRIVATE_KEY }}

      - name: 💡　Coveralls
        if: github.event_name == 'push'
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ env.BOT_TOKEN }}
          path-to-lcov: ./test/coverage/lcov.info

      - name: 💡　Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./test/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
