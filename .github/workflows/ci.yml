name: 👷　CI
on:
  workflow_call:
  pull_request:
  push:
    branches:
      - master
      - next
      - next-major
      - alpha
      - beta
      # Temporary direct-head comparison for the lifecycle investigation.
      - codex/gc-observer-lifetime-controls
jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: ⤵️　Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🧾　Verify tested revision
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$GITHUB_SHA"
          echo "Tested checkout: $actual_sha"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            actual_head="$(git rev-parse HEAD^2)"
            test "$actual_head" = "${{ github.event.pull_request.head.sha }}"
            echo "PR head in tested merge: $actual_head"
          fi

      - name: 🎉　Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: 🎉　Setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 🚧　Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 🧹　Check source and test lint
        run: pnpm run lint:check

      - name: 📦　Build
        run: pnpm run build

      - name: 🔎　Check published entries
        run: pnpm run test:package

      - name: 🔎　Check browser test types
        run: pnpm run test:browser:types

      - name: 🌐　Install browser engines
        run: pnpm exec playwright install --with-deps

      - name: 🧪　Test migrated regressions and browser behavior
        # Temporary paired observers on the investigation branch only.
        env:
          GC_OBSERVER_DIAGNOSTICS: ${{ (github.head_ref == 'codex/gc-observer-lifetime-controls' || github.ref == 'refs/heads/codex/gc-observer-lifetime-controls') && '1' || '0' }}
        run: |
          if [ "$GC_OBSERVER_DIAGNOSTICS" = "1" ]; then
            pnpm run test:coverage
            node scripts/gc-diagnostic-cache.mjs save
            pnpm run test:browser:source
          else
            pnpm run test
          fi

      - name: 📦　Test built package in browsers
        run: pnpm run test:browser:package

      # Restore the pre-source sorting inputs so failures are not moved first.
      - name: 🔬　Repeat source with the same configuration and sort cache
        id: gc_same_configuration_control
        if: ${{ failure() && (github.head_ref == 'codex/gc-observer-lifetime-controls' || github.ref == 'refs/heads/codex/gc-observer-lifetime-controls') }}
        env:
          GC_OBSERVER_DIAGNOSTICS: '1'
          GC_OBSERVER_PHASE: same-configuration-control
        run: |
          node scripts/gc-diagnostic-cache.mjs restore same-configuration-control
          pnpm run test:browser:source > .vitest/attachments/gc-same-configuration-control.log 2>&1

      # Temporary controls keep normal failures and three-engine concurrency.
      - name: 🔬　Check graph-writing configuration without logging
        id: gc_sandbox_control
        if: ${{ failure() && steps.gc_same_configuration_control.conclusion == 'failure' }}
        env:
          GC_OBSERVER_DIAGNOSTICS: '1'
          GC_OBSERVER_PHASE: sandbox-control
          MOZ_DISABLE_CONTENT_SANDBOX: t
        run: |
          node scripts/gc-diagnostic-cache.mjs restore sandbox-control
          pnpm run test:browser:source > .vitest/attachments/gc-sandbox-control.log 2>&1

      - name: 🔬　Trace cycle references if the control still fails
        if: ${{ failure() && steps.gc_sandbox_control.conclusion == 'failure' }}
        env:
          GC_OBSERVER_DIAGNOSTICS: '1'
          GC_OBSERVER_PHASE: cc-only-trace
          MOZ_DISABLE_CONTENT_SANDBOX: t
          MOZ_CC_LOG_ALL: '1'
          MOZ_CC_DISABLE_GC_LOG: '1'
          MOZ_CC_LOG_PROCESS: content
          MOZ_CC_LOG_THREAD: main
        run: |
          export MOZ_CC_LOG_DIRECTORY="$PWD/.vitest/attachments/gc-cc-only-graphs"
          mkdir -p "$MOZ_CC_LOG_DIRECTORY"
          node scripts/gc-diagnostic-cache.mjs restore cc-only-trace
          trace_status=0
          pnpm run test:browser:source > .vitest/attachments/gc-cc-only-trace.log 2>&1 || trace_status=$?
          tar -czf "$RUNNER_TEMP/gc-cc-only-graphs.tar.gz" -C "$MOZ_CC_LOG_DIRECTORY" .
          rm -r "$MOZ_CC_LOG_DIRECTORY"
          mv "$RUNNER_TEMP/gc-cc-only-graphs.tar.gz" .vitest/attachments/
          exit "$trace_status"

      - name: 📋　Upload browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            .vitest/attachments/
          if-no-files-found: ignore

      - name: 🔑　Generate Token
        if: github.event_name == 'push'
        uses: wow-actions/use-app-token@v2
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.PRIVATE_KEY }}

      - name: 💡　Coveralls
        if: github.event_name == 'push'
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ env.BOT_TOKEN }}
          path-to-lcov: ./test/coverage/lcov.info

      - name: 💡　Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./test/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
