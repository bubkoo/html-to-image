<!DOCTYPE html>
<html lang="en">
  <meta charset="utf-8" />
  <title>html-to-image browser smoke</title>
  <style>
    body {
      font: 16px system-ui;
    }
    .case {
      margin: 12px;
      padding: 4px;
    }
  </style>
  <h1>Browser smoke</h1>
  <pre id="results">Running...</pre>
  <script type="module">
    import { createRenderer, toImageData, toPng, toSvg } from '../../es/index.js'
    import { checkFontMetrics } from './fixtures/font-metrics.mjs'
    import { checkIframeFonts } from './fixtures/iframe-fonts.mjs'
    import { checkCaptureLifetime } from './fixtures/capture-lifetime.mjs'
    import { checkPseudoResources } from './fixtures/pseudo-resources.mjs'
    import { checkSVGDependencies } from './fixtures/svg-dependencies.mjs'
    import {
      checkResourceCache,
      checkNativeCachePolicy,
      checkResourceCredentials,
      checkRelativeCloneAssets,
    } from './fixtures/resource-policy.mjs'

    const results = document.querySelector('#results')
    const verdicts = []
    const selectedCase = new URLSearchParams(location.search).get('case')
    verdicts.push(`INFO ${navigator.userAgent} DPR=${devicePixelRatio}`)
    const pixel = (image, x, y) =>
      Array.from(
        image.data.slice(
          4 * (y * image.width + x),
          4 * (y * image.width + x) + 4,
        ),
      )

    async function test(name, run) {
      if (selectedCase && selectedCase !== name) return
      try {
        await run()
        verdicts.push(`PASS ${name}`)
      } catch (error) {
        verdicts.push(`FAIL ${name}: ${error.message}`)
      }
      results.textContent = verdicts.join('\n')
    }

    await test('ESM import and basic PNG', async () => {
      const node = document.createElement('div')
      node.className = 'case'
      node.style.cssText =
        'width:32px;height:32px;background:rgb(255,0,0);padding:0;margin:0'
      document.body.append(node)
      const png = await toPng(node, { pixelRatio: 1, skipFonts: true })
      if (!png.startsWith('data:image/png'))
        throw new Error('PNG data URL missing')
      const decoded = new Image()
      decoded.src = png
      await decoded.decode()
      if (decoded.naturalWidth !== 32 || decoded.naturalHeight !== 32)
        throw new Error(`PNG dimensions ${decoded.naturalWidth}x${decoded.naturalHeight}`)
      const canvas = document.createElement('canvas')
      canvas.width = canvas.height = 32
      const context = canvas.getContext('2d')
      context.drawImage(decoded, 0, 0)
      const pngPixel = Array.from(context.getImageData(16, 16, 1, 1).data)
      if (pngPixel.join(',') !== '255,0,0,255')
        throw new Error(`PNG center pixel ${pngPixel}`)
      const image = await toImageData(node, { pixelRatio: 1, skipFonts: true })
      if (pixel(image, 16, 16).join(',') !== '255,0,0,255') {
        throw new Error(`center pixel ${pixel(image, 16, 16)}`)
      }
    })

    await test('UMD global and pixels', async () => {
      if (!window.htmlToImage) {
        const script = document.createElement('script')
        script.src = '/dist/html-to-image.js'
        await new Promise((resolve, reject) => {
          script.onload = resolve
          script.onerror = () => reject(new Error('UMD script did not load'))
          document.head.append(script)
        })
      }
      const node = document.createElement('div')
      node.style.cssText = 'width:20px;height:20px;background:rgb(255,0,0)'
      document.body.append(node)
      const image = await window.htmlToImage.toImageData(node, {
        pixelRatio: 1,
        skipFonts: true,
      })
      const color = pixel(image, 10, 10)
      if (color.join(',') !== '255,0,0,255')
        throw new Error(`UMD center pixel ${color}`)
    })

    await test('canvas snapshot pixels', async () => {
      const canvas = document.createElement('canvas')
      canvas.width = 16
      canvas.height = 8
      canvas.style.cssText = 'display:block;width:32px;height:16px'
      const context = canvas.getContext('2d')
      context.fillStyle = 'red'
      context.fillRect(0, 0, 8, 8)
      context.fillStyle = 'blue'
      context.fillRect(8, 0, 8, 8)
      document.body.append(canvas)
      const image = await toImageData(canvas, { pixelRatio: 1, skipFonts: true })
      if (image.width !== 32 || image.height !== 16)
        throw new Error(`canvas dimensions ${image.width}x${image.height}`)
      for (const [x, expected] of [
        [8, '255,0,0,255'],
        [24, '0,0,255,255'],
      ]) {
        const color = pixel(image, x, 8).join(',')
        if (color !== expected)
          throw new Error(`canvas pixel ${x},8: expected ${expected}, got ${color}`)
      }
    })

    await test('explicit dimensions and pixel ratio', async () => {
      const node = document.createElement('div')
      node.style.cssText = 'width:16px;height:12px;background:red'
      document.body.append(node)
      const renderer = createRenderer({ skipFonts: true, pixelRatio: 2 })
      try {
        const canvas = await renderer.toCanvas(node, {
          width: 24, height: 18, canvasWidth: 40, canvasHeight: 30,
        })
        if (canvas.width !== 80 || canvas.height !== 60 ||
            canvas.style.width !== '40px' || canvas.style.height !== '30px')
          throw new Error(`scaled dimensions ${canvas.width}x${canvas.height}, CSS ${canvas.style.cssText}`)
        const color = Array.from(canvas.getContext('2d').getImageData(78, 58, 1, 1).data)
        if (color.join(',') !== '255,0,0,255')
          throw new Error(`scaled corner pixel ${color}`)
        for (const dimension of ['width', 'height']) {
          const capture = await renderer.capture(node, { [dimension]: 0 })
          const svg = new DOMParser().parseFromString(
            decodeURIComponent((await capture.toSvg()).split(',')[1]), 'image/svg+xml',
          )
          if (capture[dimension] !== 0 || svg.documentElement.getAttribute(dimension) !== '0' ||
              svg.querySelector('foreignObject > div').style[dimension] !== '0px')
            throw new Error(`zero ${dimension} was replaced`)
          let rasterError = ''
          try { await capture.toCanvas() } catch (error) { rasterError = error.message }
          capture.dispose()
          if (!rasterError.includes('zero-sized'))
            throw new Error(`zero ${dimension} rasterized`)
          let invalidError = ''
          try { await renderer.capture(node, { [dimension]: NaN }) } catch (error) { invalidError = error.message }
          if (!invalidError.includes('dimensions must be finite'))
            throw new Error(`NaN ${dimension} was accepted`)
        }
        if (node.style.width !== '16px' || node.style.height !== '12px')
          throw new Error('source dimensions changed')
      } finally {
        renderer.dispose()
        node.remove()
      }
    })

    await test('fractional fonts and tight last word', async () => {
      await checkFontMetrics({ toSvg, toImageData })
    })

    await test('iframe fonts and document scope', async () => {
      await checkIframeFonts({ createRenderer })
    })

    await test('capture source document lifetime', async () => {
      await checkCaptureLifetime({ createRenderer })
      if (!window.htmlToImage) {
        const script = document.createElement('script')
        script.src = '/dist/html-to-image.js'
        await new Promise((resolve, reject) => {
          script.onload = resolve
          script.onerror = () => reject(new Error('UMD script did not load'))
          document.head.append(script)
        })
      }
      await checkCaptureLifetime(window.htmlToImage)
    })

    await test('pseudo background and injected mask resources', async () => {
      await checkPseudoResources({ createRenderer }, { skipFonts: true })
      await checkPseudoResources({ createRenderer }, { skipFonts: false })
      if (!window.htmlToImage) {
        const script = document.createElement('script')
        script.src = '/dist/html-to-image.js'
        await new Promise((resolve, reject) => {
          script.onload = resolve
          script.onerror = () => reject(new Error('UMD script did not load'))
          document.head.append(script)
        })
      }
      await checkPseudoResources(window.htmlToImage, { skipFonts: true })
      await checkPseudoResources(window.htmlToImage, { skipFonts: false })
    })

    await test('SVG dependency graphs and reference precedence', async () => {
      await checkSVGDependencies({ createRenderer })
      if (!window.htmlToImage) {
        const script = document.createElement('script')
        script.src = '/dist/html-to-image.js'
        await new Promise((resolve, reject) => {
          script.onload = resolve
          script.onerror = () => reject(new Error('UMD script did not load'))
          document.head.append(script)
        })
      }
      await checkSVGDependencies(window.htmlToImage)
    })

    await test('resource cache lifetime', async () => {
      await checkResourceCache({ createRenderer, toImageData })
    })

    await test('native HTTP cache policy', async () => {
      await checkNativeCachePolicy({ toImageData })
    })

    await test('per-URL resource credentials', async () => {
      await checkResourceCredentials({ toSvg, toImageData })
    })

    await test('relative clone resources and callback errors', async () => {
      await checkRelativeCloneAssets({ createRenderer, toSvg, toImageData })
    })

    await test('per-node customization', async () => {
      const node = document.createElement('div')
      node.style.cssText = 'width:20px;height:20px;background:red'
      document.body.append(node)
      const image = await toImageData(node, {
        pixelRatio: 1,
        skipFonts: true,
        stylePropertiesForNode: () => ['background-color'],
        onCloneNode: (original, copy) => {
          if (original === node) copy.style.background = 'green'
        },
      })
      const color = pixel(image, 10, 10)
      if (color.join(',') !== '0,128,0,255')
        throw new Error(`customized pixel ${color}`)
      if (node.style.background !== 'red')
        throw new Error('source style changed')
    })

    await test('shadow slot fallback and assignment', async () => {
      const host = document.createElement('div')
      host.style.cssText = 'display:block;width:40px;height:20px'
      const shadow = host.attachShadow({ mode: 'open' })
      shadow.innerHTML =
        '<slot><div id="fallback" style="width:40px;height:20px;background:green"></div></slot>'
      document.body.append(host)
      try {
        const options = { pixelRatio: 1, skipFonts: true }
        const fallback = await toImageData(host, options)
        if (pixel(fallback, 20, 10).join(',') !== '0,128,0,255')
          throw new Error(`fallback pixel ${pixel(fallback, 20, 10)}`)
        const assigned = document.createElement('div')
        assigned.id = 'assigned'
        assigned.style.cssText = 'width:40px;height:20px;background:red'
        host.append(assigned)
        const output = await toImageData(host, options)
        if (pixel(output, 20, 10).join(',') !== '255,0,0,255')
          throw new Error(`assigned pixel ${pixel(output, 20, 10)}`)
        if (!shadow.querySelector('#fallback') || host.firstChild !== assigned)
          throw new Error('source slot state changed')
      } finally {
        host.remove()
      }
    })

    await test('same-origin iframe viewport', async () => {
      const root = document.createElement('div')
      root.style.cssText = 'width:60px;height:40px;display:flex'
      const spacer = document.createElement('div')
      spacer.style.cssText = 'width:20px;height:40px;flex:none'
      const frame = document.createElement('iframe')
      frame.style.cssText =
        'display:block;width:40px;height:40px;border:0;flex:none'
      const loaded = new Promise((resolve) => { frame.onload = resolve })
      frame.srcdoc =
        '<style>html,body{margin:0}</style>' +
        '<div style="position:fixed;top:0;left:0;width:40px;height:8px;background:blue"></div>' +
        '<div style="width:40px;height:40px;background:red"></div>' +
        '<div style="width:40px;height:40px;background:green"></div>'
      root.append(spacer, frame)
      document.body.append(root)
      try {
        await loaded
        frame.contentWindow.scrollTo(0, 40)
        const options = { pixelRatio: 1, skipFonts: true }
        const vertical = await toImageData(root, options)
        for (const [x, y, expected] of [
          [10, 4, '0,0,0,0'],
          [40, 4, '0,0,255,255'],
          [40, 20, '0,128,0,255'],
        ]) {
          const actual = pixel(vertical, x, y).join(',')
          if (actual !== expected)
            throw new Error(`vertical iframe pixel ${x},${y}: ${actual}`)
        }
        if (frame.contentWindow.scrollY !== 40)
          throw new Error('source iframe vertical scroll changed')

        const reloaded = new Promise((resolve) => { frame.onload = resolve })
        frame.srcdoc =
          '<style>html,body{margin:0}body{width:80px;display:flex}</style>' +
          '<div style="width:40px;height:40px;flex:none;background:red"></div>' +
          '<div style="width:40px;height:40px;flex:none;background:green"></div>'
        await reloaded
        frame.contentWindow.scrollTo(40, 0)
        const horizontal = await toImageData(root, options)
        const color = pixel(horizontal, 40, 20).join(',')
        if (color !== '0,128,0,255')
          throw new Error(`horizontal iframe pixel ${color}`)
        if (frame.contentWindow.scrollX !== 40)
          throw new Error('source iframe horizontal scroll changed')
      } finally {
        root.remove()
      }
    })

    await test('nested visible scroll position', async () => {
      const scene = document.createElement('div')
      scene.style.cssText = 'width:40px;height:40px;padding:0;margin:0'
      const panel = document.createElement('div')
      panel.style.cssText =
        'width:40px;height:40px;overflow:auto;padding:0;margin:0'
      panel.innerHTML =
        '<div style="height:40px;background:red"></div>' +
        '<div style="height:40px;background:green"></div>'
      scene.append(panel)
      document.body.append(scene)
      panel.scrollTop = 40
      const image = await toImageData(scene, { pixelRatio: 1, skipFonts: true })
      const color = pixel(image, 20, 20)
      if (color[1] < 100 || color[0] > 30) {
        throw new Error(`expected green visible row, got ${color}`)
      }
      if (panel.scrollTop !== 40)
        throw new Error('source scroll position changed')
    })

    await test('sticky child after spacer', async () => {
      const scene = document.createElement('div')
      scene.style.cssText = 'width:40px;height:40px;overflow:hidden'
      const panel = document.createElement('div')
      panel.style.cssText = 'width:40px;height:40px;overflow:auto;transform:translate(0,0)'
      panel.innerHTML =
        '<div style="position:fixed;top:0;left:0;width:40px;height:4px;background:blue"></div>' +
        '<div style="width:40px;height:40px;background:blue"></div>' +
        '<div style="position:sticky;top:8px;width:40px;height:10px;background:red"></div>' +
        '<div style="width:40px;height:80px;background:green"></div>'
      scene.append(panel)
      document.body.append(scene)
      try {
        panel.scrollTop = 50
        const image = await toImageData(scene, {
          pixelRatio: 1,
          skipFonts: true,
        })
        const overlay = pixel(image, 20, 2).join(',')
        const sticky = pixel(image, 20, 13).join(',')
        const content = pixel(image, 20, 25).join(',')
        if (overlay !== '0,0,255,255' || sticky !== '255,0,0,255' || content !== '0,128,0,255') {
          throw new Error(`overlay/sticky/content pixels ${overlay} / ${sticky} / ${content}`)
        }
        if (panel.scrollTop !== 50)
          throw new Error('source sticky scroll position changed')
      } finally {
        scene.remove()
      }
    })

    await test('same-document clip path', async () => {
      const namespace = 'http://www.w3.org/2000/svg'
      const scene = document.createElement('div')
      scene.style.cssText = 'width:40px;height:40px;background:green'
      const svg = document.createElementNS(namespace, 'svg')
      svg.setAttribute('width', '40')
      svg.setAttribute('height', '40')
      const defs = document.createElementNS(namespace, 'defs')
      const clip = document.createElementNS(namespace, 'clipPath')
      clip.id = 'package-clip'
      const clipRect = document.createElementNS(namespace, 'rect')
      clipRect.setAttribute('width', '20')
      clipRect.setAttribute('height', '40')
      clip.append(clipRect)
      defs.append(clip)
      const rect = document.createElementNS(namespace, 'rect')
      rect.setAttribute('width', '40')
      rect.setAttribute('height', '40')
      rect.setAttribute('fill', 'red')
      const reference = `${location.href}#package-clip`
      rect.setAttribute('clip-path', `url("${reference}")`)
      svg.append(defs, rect)
      scene.append(svg)
      document.body.append(scene)
      const svgText = await fetch(await toSvg(scene, { skipFonts: true })).then((response) => response.text())
      if (!svgText.includes('clip-path="url(#package-clip)"'))
        throw new Error('same-document clip path was not localized')
      if (rect.getAttribute('clip-path') !== `url("${reference}")`)
        throw new Error('source clip path changed')
      const image = await toImageData(scene, { pixelRatio: 1, skipFonts: true })
      if (pixel(image, 10, 20).join(',') !== '255,0,0,255')
        throw new Error(`clipped region pixel ${pixel(image, 10, 20)}`)
      if (pixel(image, 30, 20).join(',') !== '0,128,0,255')
        throw new Error(`outside region pixel ${pixel(image, 30, 20)}`)
    })

    await test('SVG use local and external symbols', async () => {
      const ns = 'http://www.w3.org/2000/svg'
      const reference = './sprites.svg#icon'
      const node = document.createElement('div')
      node.style.cssText = 'width:20px;height:20px'
      const svg = document.createElementNS(ns, 'svg')
      svg.setAttribute('width', '20')
      svg.setAttribute('height', '20')
      const use = document.createElementNS(ns, 'use')
      use.setAttribute('href', reference)
      use.setAttribute('width', '20')
      use.setAttribute('height', '20')
      svg.append(use)
      node.append(svg)
      document.body.append(node)
      const options = { pixelRatio: 1, skipFonts: true }
      const source = await fetch(await toSvg(node, options)).then((res) =>
        res.text(),
      )
      if (!source.includes('fill="green"') || source.includes(reference))
        throw new Error('external symbol was not localized')
      const image = await toImageData(node, options)
      const color = pixel(image, 10, 10)
      if (color.join(',') !== '0,128,0,255')
        throw new Error(`external symbol pixel ${color}`)
      if (use.getAttribute('href') !== reference)
        throw new Error('source use href changed')
    })

    await test('cross-origin stylesheet fallback', async () => {
      const endpoint = new URL('/test/browser/cross-origin.css', location.href)
      endpoint.port = String(Number(location.port) + 1)
      const url = endpoint.href
      const node = document.createElement('div')
      node.id = 'cross-origin-target'
      node.style.cssText = 'width:32px;height:32px'
      document.body.append(node)
      const link = document.createElement('link')
      link.rel = 'stylesheet'
      link.href = url
      try {
        await new Promise((resolve, reject) => {
          link.onload = resolve
          link.onerror = () => reject(new Error('cross-origin CSS did not load'))
          document.head.append(link)
        })
        let blocked = false
        try {
          void link.sheet.cssRules
        } catch {
          blocked = true
        }
        if (!blocked) throw new Error('CSSOM was not cross-origin blocked')
        const warnings = []
        const image = await toImageData(node, {
          pixelRatio: 1,
          onEvent: (event) => {
            if (event.type === 'warning') warnings.push(event.diagnostic)
          },
        })
        const color = pixel(image, 16, 16)
        if (color.join(',') !== '255,0,0,255')
          throw new Error(`cross-origin styled pixel ${color}`)
        if (!warnings.some((item) => item.resource === url && item.code === 'resource-error'))
          throw new Error(`expected cross-origin resource diagnostic, got ${JSON.stringify(warnings)}`)
      } finally {
        link.remove()
        node.remove()
      }
    })

    await test('repeated Content-Type embeds image and CSS', async () => {
      const url = '/test/browser/duplicate-content-type'
      const response = await fetch(url)
      const types = response.headers.get('Content-Type')?.split(',').map((type) => type.trim())
      if (types?.length !== 2 || types.some((type) => type !== 'image/svg+xml'))
        throw new Error(`duplicate response header missing: ${response.headers.get('Content-Type')}`)
      const node = document.createElement('div')
      node.style.cssText = 'width:40px;height:20px;display:flex'
      const image = document.createElement('img')
      image.src = url
      image.width = 20
      image.height = 20
      const background = document.createElement('div')
      background.style.cssText = `width:20px;height:20px;background-image:url(${url})`
      node.append(image, background)
      document.body.append(node)
      const options = { pixelRatio: 1, skipFonts: true }
      const svg = await fetch(await toSvg(node, options)).then((res) => res.text())
      if (!svg.includes('data:image/svg+xml;base64,'))
        throw new Error('repeated media type was not normalized')
      const output = await toImageData(node, options)
      for (const x of [10, 30]) {
        const color = pixel(output, x, 10)
        if (color.join(',') !== '255,0,0,255')
          throw new Error(`embedded pixel ${x},10: ${color}`)
      }
      if (image.src !== new URL(url, location.href).href)
        throw new Error('source image URL changed')
    })

    await test('asynchronous image error recovery', async () => {
      const node = document.createElement('div')
      node.style.cssText = 'width:20px;height:20px'
      node.innerHTML = '<img src="data:image/png;base64,broken" width="20" height="20">'
      document.body.append(node)
      const source = node.firstChild
      try {
        const image = await toImageData(node, {
          skipFonts: true, pixelRatio: 1,
          onImageErrorHandler: async function () {
            await new Promise((resolve) => setTimeout(resolve, 30))
            const replacement = document.createElement('div')
            replacement.style.cssText = 'width:20px;height:20px;background:green'
            this.replaceWith(replacement)
          },
        })
        const color = pixel(image, 10, 10)
        if (color.join(',') !== '0,128,0,255')
          throw new Error(`recovery pixel ${color}`)
        if (node.firstChild !== source)
          throw new Error('error handler modified the source')
        const rejected = Promise.reject(new Error('recovery failed'))
        rejected.catch(() => {})
        let message = ''
        try {
          await toSvg(node, {
            skipFonts: true,
            onImageErrorHandler: () => rejected,
          })
        } catch (error) { message = error.message }
        if (message !== 'recovery failed')
          throw new Error(`async handler failure was not propagated: ${message}`)
      } finally {
        node.remove()
      }
    })

    await test('large embedded data image', async () => {
      const source = document.createElement('canvas')
      source.width = 800
      source.height = 800
      const context = source.getContext('2d')
      const data = context.createImageData(800, 800)
      let seed = (Math.random() * 0xffffffff) >>> 0
      for (let i = 0; i < data.data.length; i += 4) {
        seed = (seed * 1664525 + 1013904223) >>> 0
        data.data[i] = seed & 255
        data.data[i + 1] = (seed >>> 8) & 255
        data.data[i + 2] = (seed >>> 16) & 255
        data.data[i + 3] = 255
      }
      context.putImageData(data, 0, 0)
      context.fillStyle = '#ff0000'
      context.fillRect(16, 16, 32, 32)
      context.fillStyle = '#0000ff'
      context.fillRect(736, 16, 32, 32)
      context.fillStyle = '#ffff00'
      context.fillRect(736, 736, 32, 32)
      context.fillStyle = '#00ff00'
      context.fillRect(384, 384, 32, 32)
      const image = document.createElement('img')
      image.className = 'case'
      image.style.cssText =
        'display:block;width:800px;height:800px;padding:0;margin:0'
      image.src = source.toDataURL('image/png')
      document.body.append(image)
      await image.decode()
      const baseline = await toImageData(image, {
        pixelRatio: 2,
        skipFonts: true,
      })
      const baselineColor = pixel(baseline, 800, 800)
      const result = await toImageData(image, {
        pixelRatio: 2,
        skipFonts: true,
        stabilizationAttempts: 3,
      })
      const color = pixel(result, 800, 800)
      verdicts.push(
        `INFO large-image first=${baselineColor} stabilized=${color}`,
      )
      if (color[1] < 200 || color[0] > 30 || color[2] > 30) {
        throw new Error(`expected green marker, got ${color}`)
      }
      for (const [x, y, expected] of [
        [32, 32, [255, 0, 0, 255]],
        [752, 32, [0, 0, 255, 255]],
        [752, 752, [255, 255, 0, 255]],
      ]) {
        const actual = pixel(result, x * 2 + 1, y * 2 + 1)
        if (actual.join(',') !== expected.join(','))
          throw new Error(`large image pixel ${x},${y}: expected ${expected}, got ${actual}`)
      }
    })

    window.__htmlToImageSmoke = verdicts
    results.textContent += '\nDONE'
    if (!selectedCase) {
      try {
        const response = await fetch('/test/browser/mobile-smoke-report', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            complete: true,
            userAgent: navigator.userAgent,
            dpr: devicePixelRatio,
            viewport: { width: innerWidth, height: innerHeight },
            verdicts,
          }),
        })
        if (!response.ok) throw new Error(`HTTP ${response.status}`)
        const receipt = await response.json()
        results.textContent += `\nREPORT SAVED ${receipt.id}`
      } catch (error) {
        results.textContent += `\nREPORT FAILED ${error.message}`
      }
    }
  </script>
</html>
